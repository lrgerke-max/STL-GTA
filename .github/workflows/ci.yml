name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: smoke tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]

    env:
      # No display on a CI runner, and pygame will happily block waiting for
      # an audio device that is not there.
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile
        run: python -m compileall -q main.py tests

      - name: Behaviour tests
        run: python tests/test_smoke.py

      - name: Headless play-through
        run: python main.py --headless --frames 1800 --seed 1 --shot frame.png

      - name: Upload final frame
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame-py${{ matrix.python }}
          path: frame.png
          if-no-files-found: ignore
